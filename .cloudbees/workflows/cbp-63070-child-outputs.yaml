apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: cbp-63070-child-outputs

# Reusable workflow with an output, called by cbp-63070-skip-outputs.yaml.

on:
  workflow_call:
    outputs:
      verdict:
        description: verdict produced by the child job
        value: ${{ jobs.child-job.outputs.verdict }}

permissions:
  scm-token-own: read
  id-token: none

jobs:
  child-job:
    steps:
      - id: produce
        uses: docker://alpine:3.20
        run: |
          echo "child-job ran"
          echo -n "child-ok" > $CLOUDBEES_OUTPUTS/verdict
    outputs:
      verdict: ${{ steps.produce.outputs.verdict }}
