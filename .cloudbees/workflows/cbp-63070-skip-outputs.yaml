apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: cbp-63070-skip-outputs

# Verifies dsl-engine-cli#985 review: with skip propagation off, a job skipped by its own if: still
# starts its Pod and saves its (empty) outputs, so a dependent that reads those outputs in its own
# job-level if: evaluates instead of failing with "... is undefined".
#
# Each *-skip job has if: false and declares an output. Its reads-* dependent reads that output in
# its job-level if: (the case that fails when the skipped job never starts).
#
# Expected (propagation off, pre-#962 behavior):
#   every *-skip job:   user steps SKIPPED (the Pod ran and skipped them)
#   every reads-* job:  RAN, and logs verdict=''
#   reads-call-run:     RAN, and logs verdict='child-ok' (control: outputs still flow)
#   approval-env-skip:  no approval prompt (its gate is skipped by its own if:)

on:
  workflow_dispatch: {}

permissions:
  scm-token-own: read
  id-token: none

jobs:
  # Dynamic environment + own if: false (has a pre task to resolve the environment).
  dyn-env-skip:
    environment: ${{ 'skipprop-env-plain' }}
    if: ${{ false }}
    steps:
      - id: produce
        uses: docker://alpine:3.20
        run: echo -n "dyn-env-ok" > $CLOUDBEES_OUTPUTS/verdict
    outputs:
      verdict: ${{ steps.produce.outputs.verdict }}

  reads-dyn-env-skip:
    needs: [dyn-env-skip]
    if: ${{ needs.dyn-env-skip.outputs.verdict == '' }}
    steps:
      - uses: docker://alpine:3.20
        run: echo "reads-dyn-env-skip ran, verdict='${{ needs.dyn-env-skip.outputs.verdict }}'"

  # Static environment without approval + own if: false.
  static-env-skip:
    environment: skipprop-env-plain
    if: ${{ false }}
    steps:
      - id: produce
        uses: docker://alpine:3.20
        run: echo -n "static-env-ok" > $CLOUDBEES_OUTPUTS/verdict
    outputs:
      verdict: ${{ steps.produce.outputs.verdict }}

  reads-static-env-skip:
    needs: [static-env-skip]
    if: ${{ needs.static-env-skip.outputs.verdict == '' }}
    steps:
      - uses: docker://alpine:3.20
        run: echo "reads-static-env-skip ran, verdict='${{ needs.static-env-skip.outputs.verdict }}'"

  # Static environment WITH approval + own if: false. The approval prompt must not appear.
  approval-env-skip:
    environment: skipprop-env-approval
    if: ${{ false }}
    steps:
      - id: produce
        uses: docker://alpine:3.20
        run: echo -n "approval-env-ok" > $CLOUDBEES_OUTPUTS/verdict
    outputs:
      verdict: ${{ steps.produce.outputs.verdict }}

  reads-approval-env-skip:
    needs: [approval-env-skip]
    if: ${{ needs.approval-env-skip.outputs.verdict == '' }}
    steps:
      - uses: docker://alpine:3.20
        run: echo "reads-approval-env-skip ran, verdict='${{ needs.approval-env-skip.outputs.verdict }}'"

  # Reusable call with own if: false. Nested jobs must start and skip through wfContext.Skip.
  call-skip:
    if: ${{ false }}
    uses: rajnish-cloudbees/cloudbees-workflow-testing/.cloudbees/workflows/cbp-63070-child-outputs.yaml

  reads-call-skip:
    needs: [call-skip]
    if: ${{ needs.call-skip.outputs.verdict == '' }}
    steps:
      - uses: docker://alpine:3.20
        run: echo "reads-call-skip ran, verdict='${{ needs.call-skip.outputs.verdict }}'"

  # Control: a reusable call that runs. Its output must reach the dependent.
  call-run:
    uses: rajnish-cloudbees/cloudbees-workflow-testing/.cloudbees/workflows/cbp-63070-child-outputs.yaml

  reads-call-run:
    needs: [call-run]
    if: ${{ needs.call-run.outputs.verdict == 'child-ok' }}
    steps:
      - uses: docker://alpine:3.20
        run: echo "reads-call-run ran, verdict='${{ needs.call-run.outputs.verdict }}'"
