apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: skipped-job-outputs
on:
  workflow_dispatch:
jobs:
  static-env-skip:
    environment: skipprop_LOCAL
    if: ${{ false }}
    steps:
      - id: produce
        uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: echo -n "env-ok" > $CLOUDBEES_OUTPUTS/verdict
    outputs:
      verdict: ${{ steps.produce.outputs.verdict }}

  reads-static-env-skip:
    needs: [static-env-skip]
    if: ${{ needs.static-env-skip.outputs.verdict == '' }}
    steps:
      - uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: echo "reads-static-env-skip ran"

  call-skip:
    if: ${{ false }}
    uses: rajnish-cloudbees/cloudbees-workflow-testing/.cloudbees/workflows/callable-output-5a938a53-55d5-4e69-9c5a-042978c2b1ae.yaml

  reads-call-skip:
    needs: [call-skip]
    if: ${{ needs.call-skip.outputs.verdict == '' }}
    steps:
      - uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: echo "reads-call-skip ran"

  call-run:
    uses: rajnish-cloudbees/cloudbees-workflow-testing/.cloudbees/workflows/callable-output-5a938a53-55d5-4e69-9c5a-042978c2b1ae.yaml

  reads-call-run:
    needs: [call-run]
    if: ${{ needs.call-run.outputs.verdict == 'child-ok' }}
    steps:
      - uses: docker://golang:1.20.3-alpine3.17
        shell: sh
        run: echo "reads-call-run ran"
