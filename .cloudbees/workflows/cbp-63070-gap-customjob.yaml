apiVersion: automation.cloudbees.io/v1alpha1
kind: CustomJob
name: cbp-63070-gap-customjob
description: Minimal custom job to reproduce the skip-crash gap
handlers:
  init:
    uses: docker://alpine:3.20
    command: /bin/sh
    env:
      CALLBACK_URL: ${{ callback.url }}
      CALLBACK_TOKEN: ${{ callback.token }}
    args: "-c \"echo '=== COMPLETE CUSTOM JOB: run the curl below ==='; echo \\\"curl -sS -X POST '$CALLBACK_URL' -H 'Authorization: Bearer $CALLBACK_TOKEN' -H 'Content-Type: application/json' -d '{\\\\\\\"payload\\\\\\\":\\\\\\\"ok\\\\\\\"}'\\\"\""
  callback:
    uses: docker://alpine:3.20
    command: /bin/sh
    args: -c "echo ${{ handler.payload }}"
  cancel:
    uses: docker://alpine:3.20
    command: /bin/sh
    args: -c "echo cancel"
