apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: cbp-63070-gap-child-edge

on:
  workflow_call: {}

permissions:
  scm-token-own: read
  id-token: none

jobs:
  # An edge (runs-on: [self-hosted]) job nested in a reusable workflow. When the parent
  # call's init job is skipped, this job still requests __wf_context with no
  # --needs-skip wiring — the second gap case.
  edge-child:
    runs-on: [self-hosted, os:linux]
    steps:
      - uses: docker://alpine:3.20
        run: echo "edge-child should be skipped"
